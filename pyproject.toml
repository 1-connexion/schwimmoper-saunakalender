[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "schwimmoper-saunakalender"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["requests==2.34.2", "beautifulsoup4==4.15.0", "icalendar==7.3.0"]
[project.optional-dependencies]
test = ["pytest==9.2.0"]
[project.scripts]
schwimmoper-kalender = "schwimmoper_saunakalender.cli:main"
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
